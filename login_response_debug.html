    <!-- Robust fallback: ensure nav-notify clicks always open notify modal and manage aria-hidden -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        try {
          const safeJson = (res) => res.json().catch(() => ({}));
          const openNotifyModal = async (btn) => {
            try {
              const modal = document.getElementById("notifyModal");
              if (!modal) {
                // nothing to show
                return;
              }
              // If this is a non-super-admin viewer, try to fetch notifications and populate preview
              const preview = document.getElementById("notifyListPreview");
                if (preview) {
                preview.innerHTML =
                  '<div class="text-muted">messages.loading</div>';
                try {
                  const res = await fetch("/api/notifications");
                  const data = await safeJson(res);
                  const list = (data && data.notifications) || [];
                  preview.innerHTML = "";
                  if (list.length === 0)
                    preview.innerHTML =
                      '<div class="text-muted">messages.no_notifications</div>';
                  list.slice(0, 10).forEach((n) => {
                    const item = document.createElement("div");
                    item.className = "mb-2";
                    item.innerHTML = `<div style="font-weight:600">${
                      n.title || ""
                    }</div><div style="font-size:12px;color:#666">${
                      n.body || ""
                    }</div><hr/>`;
                    preview.appendChild(item);
                  });
                } catch (e) {
                  preview.innerHTML =
                    '<div class="text-muted">messages.notifications_load_error</div>';
                }
              }

              // show modal and set accessibility attributes
              modal.style.display = "block";
              modal.setAttribute("aria-hidden", "false");
              // ensure focus
              modal.setAttribute("tabindex", "-1");
              modal.focus && modal.focus();
              // mark read best-effort
              fetch("/api/notifications/mark-read", {
                method: "POST",
                headers: {
                  "X-CSRF-Token":
                    typeof CSRF_TOKEN !== "undefined" ? CSRF_TOKEN : "",
                },
              })
                .then(() => {})
                .catch(() => {});
            } catch (e) {
              /* ignore */
            }
          };

          // Attach listeners (use delegation-safe approach)
          const attach = () => {
            const btns = document.querySelectorAll(".nav-notify");
            btns.forEach((b) => {
              // remove duplicate listeners by cloning node if needed
              if (!b.__notifyAttached) {
                b.addEventListener("click", (ev) => {
                  ev.preventDefault();
                  openNotifyModal(b);
                });
                b.__notifyAttached = true;
              }
            });
          };
          attach();
          // also observe for dynamically injected nav buttons
          const nav = document.querySelector("nav");
          if (nav) {
            const mo = new MutationObserver(() => attach());
            mo.observe(nav, { childList: true, subtree: true });
          }

              // Close handlers to set aria-hidden
          const closeViewer = document.getElementById("notifyCloseViewer");
          if (closeViewer) {
            closeViewer.addEventListener("click", function () {
              const m = document.getElementById("notifyModal");
              if (m) {
                m.style.display = "none";
                m.setAttribute("aria-hidden", "true");
              }
            });
          }
          // Also ensure cancel buttons set aria-hidden
          const cancelBtn = document.getElementById("notifyCancelBtn");
          if (cancelBtn) {
            cancelBtn.addEventListener("click", function () {
              const m = document.getElementById("notifyModal");
              if (m) {
                m.style.display = "none";
                m.setAttribute("aria-hidden", "true");
              }
            });
          }
        } catch (e) {
          // swallow to avoid breaking other scripts
        }
      });

      // Language switch helper used by navbar buttons. It saves choice to session via
      // /api/change-language and reloads the page so server-rendered labels update.
      async function changeLanguage(lang) {
        try {
          applyLanguageStyles(lang);
          localStorage.setItem('language', lang);
          document.body.setAttribute('data-language', lang);
        } catch (e) {}
        try {
          fetch('/api/change-language', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ language: lang })
          }).catch(function(){});
        } catch (_) {}
        var supported = window.BASE_CONFIG.supported_languages || ['uz','ru','en','kz'];
        var path = window.location.pathname || '/';
        var segs = path.split('/');
        if (segs.length && segs[segs.length-1] === '') segs.pop();
        if (segs.length > 1 && supported.indexOf(segs[1]) !== -1) {
          segs[1] = lang;
        } else {
          segs.splice(1, 0, lang);
        }
        if (segs.length <= 2 || (segs.length === 3 && segs[2] === '')) {
          segs = ['', lang, 'menu'];
        }
        var newPath = segs.join('/');
        if (!newPath.startsWith('/')) newPath = '/' + newPath;
        var qs = window.location.search || '';
        var hash = window.location.hash || '';
        window.location.assign(newPath + qs + hash);
      };

    <!-- Navigation Bar - SECURE ROLE CHECKING -->
    
    
      <script>
        // Defensive UI recovery: if main appears empty or covered by an overlay,
        // reveal main content so the user can see an error message instead of a blank page.
        (function(){
          function isElementVisible(el){
            if(!el) return false;
            try{
              const rect = el.getBoundingClientRect();
              return rect.width > 0 && rect.height > 0;
            }catch(e){return false}
          }

          function revealMain(){
            try{
              const main = document.querySelector('main') || document.querySelector('.dashboard-main');
              if(main){
                // Ensure it's on top and visible
                main.style.zIndex = 2147483000;
                main.style.position = 'relative';
                main.style.background = main.style.background || 'white';
                main.style.minHeight = main.style.minHeight || '200px';
              }

              // Hide common full-screen overlays that may accidentally stay visible
              ['notifyModal','notifyModalFloating','chatPanel','chatPanel','memberProfileModal','notifyModalFloating'].forEach(id => {
                try{ const el = document.getElementById(id); if(el && isElementVisible(el)){ el.style.display = 'none'; el.setAttribute('aria-hidden','true'); } }catch(e){}
              });

              // Also hide modal overlays by class
              document.querySelectorAll('.modal-overlay, .public-chat-panel, .chat-panel').forEach(el => {
                try{ if(isElementVisible(el)){ el.style.display = 'none'; el.setAttribute('aria-hidden','true'); } }catch(e){}
              });

              // If nothing is visible, show a simple diagnostic message.
              // Avoid false-positives on pages that already contain text (e.g. minimal admin pages)
              const bodyRect = document.body.getBoundingClientRect();
              const contentVisible = Array.from(document.body.children).some(isElementVisible);
              const bodyText = (document.body.innerText || '').trim();
              const hasMeaningfulText = bodyText.length > 20;
              if (!contentVisible && !hasMeaningfulText) {
                const box = document.createElement('div');
                box.style.position = 'fixed';
                box.style.left = '12px';
                box.style.top = '12px';
                box.style.right = '12px';
                box.style.padding = '16px';
                box.style.zIndex = 2147483600;
                box.style.background = '#fff';
                box.style.border = '2px solid #1e88e5';
                box.style.borderRadius = '8px';
                box.style.boxShadow = '0 6px 30px rgba(0,0,0,0.2)';
                box.innerHTML = '<strong>Sahifa yuklanmadi — brauzer konsolini oching (F12) va xatoliklarni tekshiring.</strong>';
                document.body.appendChild(box);
              } else if (!contentVisible && hasMeaningfulText) {
                // Page has text but appears covered; try to bring main forward but don't show the diagnostic box.
                const main = document.querySelector('main') || document.querySelector('.dashboard-main');
                if (main) {
                  main.style.zIndex = 2147483000;
                  main.style.position = 'relative';
                }
              }
            }catch(e){ console.warn('UI recovery failed', e); }
          }

          if(document.readyState === 'complete' || document.readyState === 'interactive'){
            setTimeout(revealMain, 50);
          } else {
            document.addEventListener('DOMContentLoaded', function(){ setTimeout(revealMain, 50); });
          }
        })();
      </script>
