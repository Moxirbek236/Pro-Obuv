<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Swagger UI - Safety.uz</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist/swagger-ui.css" />
    <style>
      html,body { height:100%; margin:0; }
      #swagger-ui { height:100vh; box-sizing:border-box; }
      /* Slight visual tweaks to integrate with site chrome */
      .swagger-ui .topbar { background: #0b3b5a; }
      .swagger-ui .topbar a { color: #fff; }
      .swagger-ui .info { max-width: 980px; }
    </style>
  </head>
  <body>
    <div style="max-width:980px;margin:16px auto;padding:12px;">
      <div style="display:flex;gap:12px;align-items:center;justify-content:space-between;">
        <div style="font-size:14px;color:#0b3b5a;">
          <strong>Swagger UI (demo)</strong>
          <div style="font-size:13px;color:#334155;margin-top:6px;">Use the Authorize button (top-right) to add credentials for testing.</div>
        </div>
        <details style="font-size:13px;background:#f1f5f9;padding:8px;border-radius:8px;border:1px solid rgba(11,59,90,0.06);">
          <summary style="cursor:pointer">Demo credentials / API key</summary>
          <div style="margin-top:8px;line-height:1.45">
            <div><strong>API Key (header X-API-Key):</strong> <code>TEST_API_KEY_12345</code></div>
            <div style="margin-top:6px"><strong>Basic auth (demo user):</strong> <code>demo / DemoPass123</code></div>
            <div style="margin-top:8px;color:#475569;font-size:12px">These are examples for local testing only — create real secrets on the server for production.</div>
          </div>
        </details>
      </div>
    </div>
    <div id="swagger-ui"></div>
    <script src="https://unpkg.com/swagger-ui-dist/swagger-ui-bundle.js"></script>
    <script>
      window.onload = function () {
        try {
          const ui = SwaggerUIBundle({
            url: "{{ openapi_url }}",
            dom_id: '#swagger-ui',
            presets: [SwaggerUIBundle.presets.apis],
            layout: 'BaseLayout',
            deepLinking: true,
            docExpansion: 'none',
            defaultModelsExpandDepth: -1,
            operationsSorter: 'alpha',
            showExtensions: false,
            showCommonExtensions: false,
            validatorUrl: null,
            tryItOutEnabled: false,
            persistAuthorization: true
          });
          window.ui = ui;
          /* Pre-authorize demo credentials for testing (only works if your OpenAPI defines matching securitySchemes):
             - An apiKey scheme named "ApiKeyAuth" (in: header, name: X-API-Key)
             - A basic auth scheme named "basicAuth"
             If your OpenAPI uses different names, change the keys below accordingly. */
          try {
            // preauthorize API key (security scheme name must match your OpenAPI)
            if (ui && ui.preauthorizeApiKey) {
              ui.preauthorizeApiKey('ApiKeyAuth', 'TEST_API_KEY_12345');
            }

            // preauthorize Basic auth via the authActions (scheme name 'basicAuth')
            if (ui && ui.authActions && ui.authActions.authorize) {
              ui.authActions.authorize({ basicAuth: { username: 'demo', password: 'DemoPass123' } });
            }
          } catch (e) {
            console.warn('Pre-authorization helper did not run:', e);
          }
        } catch (e) {
          console.error('Swagger UI init failed', e);
          document.getElementById('swagger-ui').innerText = 'Swagger UI failed to initialize.';
        }
      };
    </script>
  </body>
</html>
