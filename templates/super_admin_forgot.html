{% extends "base.html" %} {% block title %}Parol esdan chiqdi{% endblock %} {%
block content %}
<div class="center-card">
  <h2>Parolni tiklash</h2>
  <p>
    Super admin hisobiga bir martalik kod yuboriladi. Iltimos, telefon
    raqamingizni tekshiring va kodni kiriting.
  </p>

  <form
    id="send-code-form"
    action="{{ url_for('super_admin_send_code') }}"
    method="post">
    <button class="btn btn-primary" type="submit">Kod yuborish</button>
  </form>

  <hr />

  <form
    id="verify-code-form"
    action="{{ url_for('super_admin_verify_code') }}"
    method="post">
    <div class="form-group">
      <label>SMS kod</label>
      <input
        type="text"
        name="code"
        required
        maxlength="6"
        pattern="\d{6}"
        placeholder="000000" />
    </div>
    <button class="btn btn-primary" type="submit">Tekshirish</button>
  </form>
</div>

<style>
  .center-card {
    max-width: 480px;
    margin: 40px auto;
    padding: 24px;
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
  }
  .form-group {
    margin-bottom: 14px;
  }
</style>
{% endblock %}
