<!-- News Ticker Component -->
<div class="news-ticker-container">
  <div class="news-ticker-wrapper">
    <div class="news-ticker-title">
      <i class="bi bi-newspaper"></i> <span>{{ _('ticker.title') if _('ticker.title') else 'YANGILIKLAR' }}</span>
    </div>

    <div class="news-ticker swiper" id="newsTickerSwiper">
      <div class="swiper-wrapper" id="newsTickerContent">
        <!-- Slides will be injected here -->
        <div class="swiper-slide news-item loading">
          <div class="news-image-wrapper">
             <div class="placeholder-glow w-100 h-100"></div>
          </div>
          <div class="news-text-content">
            <div class="news-title">{{ _('messages.loading') }}</div>
          </div>
        </div>
      </div>

      <!-- Add Swiper Navigation -->
      <button class="news-nav-btn news-nav-prev swiper-button-prev">
        <i class="bi bi-chevron-left"></i>
      </button>
      <button class="news-nav-btn news-nav-next swiper-button-next">
        <i class="bi bi-chevron-right"></i>
      </button>
      
      <!-- Add Swiper Pagination -->
      <div class="swiper-pagination"></div>
    </div>
    
    {% if session.get('super_admin') %}
    <button id="addTickerNewsBtn" title="{{ _('ticker.add_news') }}" onclick="openTickerNewsModal()">
      <i class="bi bi-plus-lg"></i>
    </button>
    {% endif %}
  </div>
</div>

<script src="{{ url_for('static', filename='js/news-ticker.js') }}"></script>
