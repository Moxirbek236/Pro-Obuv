{% extends "base.html" %}
{% block content %}
  <div class="grid-2">
    <div class="card">
      <h2>Xodim kirishi</h2>
      <form method="post">
        <label>Xodim ID</label>
        <input type="number" name="staff_id" required placeholder="Masalan: 3">
        <label>Parol</label>
        <input type="password" name="password" required>
        <button class="btn" type="submit">Kirish</button>
      </form>
    </div>
    <div class="card">
      <h2>Ro'yxatdan o'tmaganmisiz?</h2>
      <p>Avval ro'yxatdan o'ting, ID sizga avtomatik beriladi.</p>
      <a class="btn" href="{{ url_for('staff_register') }}">Registratsiya</a>
    </div>
  </div>
{% endblock %}
{% extends "base.html" %}

{% block content %}
<div class="card center">
  <h2>Xodim Kirish</h2>
  <form method="post">
    <label for="staff_id">Xodim ID:</label>
    <input type="text" id="staff_id" name="staff_id" required>
    
    <label for="password">Parol:</label>
    <input type="password" id="password" name="password" required>
    
    <div class="actions">
      <button type="submit" class="btn big">Kirish</button>
      <a href="{{ url_for('staff_register') }}" class="btn">Ro'yxatdan o'tish</a>
    </div>
  </form>
</div>
{% endblock %}
