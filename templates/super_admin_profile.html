{% extends 'base.html' %} {% block content %}
<div class="container mt-4">
  <h2>Super Admin Profil</h2>
  <form
    method="POST"
    action="{{ url_for('super_admin_profile_update') }}"
    enctype="multipart/form-data">
    <div class="mb-3">
      <label class="form-label">Foydalanuvchi nomi</label>
      <input
        type="text"
        name="username"
        class="form-control"
        value="{{ user.username or '' }}"
        required />
    </div>
    <div class="mb-3">
      <label class="form-label">Yangi parol (qoldirish shart emas)</label>
      <input type="password" name="password" class="form-control" />
    </div>
    <div class="mb-3">
      <label class="form-label">Ism</label>
      <input
        type="text"
        name="first_name"
        class="form-control"
        value="{{ user.first_name or '' }}" />
    </div>
    <div class="mb-3">
      <label class="form-label">Familiya</label>
      <input
        type="text"
        name="last_name"
        class="form-control"
        value="{{ user.last_name or '' }}" />
    </div>
    <div class="mb-3">
      <label class="form-label">Telefon</label>
      <input
        type="text"
        name="phone"
        class="form-control"
        value="{{ user.phone or '' }}" />
    </div>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input
        type="email"
        name="email"
        class="form-control"
        value="{{ user.email or '' }}" />
    </div>
    <div class="mb-3">
      <label class="form-label">Manzil</label>
      <input
        type="text"
        name="address"
        class="form-control"
        value="{{ user.address or '' }}" />
    </div>
    <div class="mb-3">
      <label class="form-label">Karta (faqat oxirgi 4 raqam saqlanadi)</label>
      <input
        type="text"
        name="card_number"
        class="form-control"
        placeholder="XXXX-XXXX-XXXX-1234" />
      {% if user.card_last4 %}
      <div class="form-text">
        Saqlangan karta: **** **** **** {{ user.card_last4 }}
      </div>
      {% endif %}
    </div>
    <div class="mb-3">
      <label class="form-label">Profil rasmi</label>
      <input type="file" name="avatar" accept="image/*" class="form-control" />
      {% if user.avatar %}
      <div class="mt-2">
        <img
          src="{{ user.avatar or '/static/images/default-avatar.svg' }}"
          width="120"
          class="app-avatar" />
      </div>
      {% endif %}
    </div>
    <button class="btn btn-primary">Saqlash</button>
  </form>
</div>
{% endblock %}
