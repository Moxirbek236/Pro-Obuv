<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Yangi parol o'rnatish</title>
    <style>
      :root {
        --accent: #0d6efd;
        --muted: #666;
      }
      body.auth-page {
        font-family: Arial, Helvetica, sans-serif;
        background: #f5f7fb;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
      }
      .auth-card {
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 6px 20px rgba(25, 40, 60, 0.08);
        width: 520px;
        max-width: 96%;
        padding: 26px;
      }
      .auth-card h3 {
        margin: 0 0 8px;
        font-size: 20px;
        color: #0b2546;
      }
      .muted {
        color: var(--muted);
        font-size: 14px;
      }
      .form-group {
        margin-bottom: 14px;
      }
      label {
        display: block;
        font-size: 13px;
        color: #4b5563;
        margin-bottom: 6px;
      }
      input.form-control {
        width: 100%;
        padding: 10px;
        border: 1px solid #e6e9ef;
        border-radius: 6px;
        font-size: 14px;
      }
      .btn {
        display: inline-block;
        padding: 10px 14px;
        border-radius: 6px;
        border: none;
        background: var(--accent);
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
      .mb-3 {
        margin-bottom: 12px;
      }
      @media (max-width: 480px) {
        .auth-card {
          padding: 18px;
          width: 100%;
        }
      }
    </style>
  </head>
  <body class="auth-page">
    <div class="auth-card">
      <h3>Yangi parolni kiriting</h3>
      <form method="POST" action="{{ url_for('forgot_reset_password') }}">
        <div class="mb-3">
          <label>Yangi parol</label>
          <input
            type="password"
            name="password"
            class="form-control"
            required />
        </div>
        <div class="mb-3">
          <label>Parolni tasdiqlang</label>
          <input
            type="password"
            name="password_confirm"
            class="form-control"
            required />
        </div>
        <button type="submit" class="btn btn-primary">
          Parolni o'zgartirish
        </button>
      </form>
    </div>
  </body>
</html>
