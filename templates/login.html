<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kirish - Pro-Obuv</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}" />
    <!-- Modern site styles (auth/footer) -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/site-modern.css') }}" />
  </head>
  <body class="auth-page">
    <div class="auth-card">
      <div class="brand">
        <img
          src="{{ prefer_webp(url_for('static', filename='favicons/favicon-32x32.png')) }}"
          alt="logo"
          onerror="this.style.display='none'" />
        <div>
          <h2 class="mb-0">{{ _('nav.login') }}</h2>
          <small class="text-muted-weak">{{ _('nav.brand') }}</small>
        </div>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %} {% if
      messages %} {% for category, message in messages %}
      <div
        class="alert alert-{{ 'danger' if category=='error' else 'success' if category=='success' else category }} alert-dismissible fade show"
        role="alert">
        {{ message }}
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="alert"></button>
      </div>
      {% endfor %} {% endif %} {% endwith %}

      <form method="POST">
        <div class="mb-3">
          <label for="email" class="form-label"> Email</label>
          <input
            type="email"
            class="form-control"
            id="email"
            name="email"
            required />
        </div>

        <div class="mb-3">
          <label for="password" class="form-label"> Parol</label>
          <input
            type="password"
            class="form-control"
            id="password"
            name="password"
            required />
        </div>

        <button type="submit" class="btn btn-login">Kirish</button>
      </form>

      <div class="text-center mt-3">
        <div id="g_id_signin"></div>
      </div>

      <div class="text-center mt-2">
        <a href="{{ url_for('forgot') }}">Parolni unutdingiz?</a>
      </div>

      <div class="text-center mt-3">
        <p>
          Akkauntingiz yo'qmi?
          <a href="{{ url_for('register') }}">Ro'yxatdan o'ting</a>
        </p>
        <a href="{{ url_for('index') }}" class="btn btn-outline-secondary"
          >⬅ Bosh sahifa</a
        >
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // Initialize Google Sign-In when the GSI client script has loaded
      function handleCredentialResponse(response) {
        if (!response || !response.credential) return;
        fetch('/auth/google', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id_token: response.credential })
        }).then(r => r.json()).then(data => {
          if (data && data.success) {
            window.location = data.next || '/';
          } else {
            alert('Google login failed: ' + (data && data.message || ''));
          }
        }).catch(e => { console.error(e); alert('Google login error'); });
      }

      function initGoogleSignIn() {
        try {
          if (!window.google || !google.accounts || !google.accounts.id) {
            console.warn('Google Identity script not available yet');
            return;
          }
          const CLIENT_ID = '{{ GOOGLE_CLIENT_ID }}';
          google.accounts.id.initialize({ client_id: CLIENT_ID, callback: handleCredentialResponse });
          google.accounts.id.renderButton(document.getElementById('g_id_signin'), { theme: 'outline', size: 'large' });
        } catch (e) {
          console.warn('Google Sign-In init failed', e);
        }
      }

      // Load GSI script dynamically and call init on load to ensure availability
      (function loadGsi(){
        var s = document.createElement('script');
        s.src = 'https://accounts.google.com/gsi/client';
        s.async = true; s.defer = true;
        s.onload = function(){ initGoogleSignIn(); };
        s.onerror = function(){ console.warn('Failed to load Google Identity Services script'); };
        document.head.appendChild(s);
      })();
    </script>
    </script>
  </body>
</html>
