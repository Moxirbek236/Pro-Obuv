{% extends "super_admin_base.html" %}

{% block content %}
<div class="row mb-4">
    <div class="col-12">
        <h2 class="mb-3">🤖 Telegram Bot Boshqaruvi</h2>
        <p class="text-muted">Broadcast xabarlar yuborish va bot holatini kuzatish.</p>
    </div>
</div>

<div class="row g-4">
    <!-- Broadcast Form -->
    <div class="col-md-5">
        <div class="card h-100">
            <div class="card-header bg-white py-3">
                <h5 class="mb-0"><i class="bi bi-megaphone me-2"></i>Xabar Yuborish</h5>
            </div>
            <div class="card-body">
                <form id="broadcastForm">
                    <div class="mb-3">
                        <label class="form-label">Xabar matni <span class="text-danger">*</span></label>
                        <textarea class="form-control" name="message" rows="4" required></textarea>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Rasm URL (ixtiyoriy)</label>
                        <input type="url" class="form-control" name="photo" placeholder="https://...">
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="form-label">Tugma Matni (ixtiyoriy)</label>
                            <input type="text" class="form-control" name="button_text">
                        </div>
                        <div class="col-6">
                            <label class="form-label">Tugma URL (ixtiyoriy)</label>
                            <input type="url" class="form-control" name="button_url">
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-send me-1"></i> Yuborish
                    </button>
                    <div id="msgStatus" class="mt-2 text-center text-muted small"></div>
                </form>
            </div>
        </div>
    </div>

    <!-- Right Side: Stats & History -->
    <div class="col-md-7">
        <!-- Subscribers Count -->
        <div class="row mb-4">
            <div class="col-sm-6">
                <div class="card bg-light border-0">
                    <div class="card-body p-3">
                        <div class="d-flex align-items-center">
                            <i class="bi bi-people fs-1 text-primary me-3"></i>
                            <div>
                                <h6 class="mb-0 text-muted">Foydalanuvchilar</h6>
                                <h3 class="mb-0" id="subCount">-</h3>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
             <div class="col-sm-6">
                <div class="card bg-light border-0">
                    <div class="card-body p-3">
                        <div class="d-flex align-items-center">
                            <i class="bi bi-clock-history fs-1 text-success me-3"></i>
                            <div>
                                <h6 class="mb-0 text-muted">Oxirgi Xabar</h6>
                                <small class="mb-0 text-muted" id="lastMsgTime">-</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- History Table -->
        <div class="card">
            <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                <h5 class="mb-0"><i class="bi bi-clock-history me-2"></i>Tarix</h5>
                <button class="btn btn-sm btn-outline-secondary" onclick="loadHistory()">
                    <i class="bi bi-arrow-clockwise"></i>
                </button>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="bg-light">
                        <tr>
                            <th>ID</th>
                            <th>Turi</th>
                            <th>Status</th>
                            <th>Vaqt</th>
                        </tr>
                    </thead>
                    <tbody id="historyBody">
                        <!-- Loaded via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    loadSubscribers();
    loadHistory();
    
    document.getElementById('broadcastForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button[type="submit"]');
        const status = document.getElementById('msgStatus');
        
        btn.disabled = true;
        status.textContent = 'Yuborilmoqda...'; 
        
        try {
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            
            // Clean empty
            if(!data.photo) delete data.photo;
            if(!data.button_text) delete data.button_text;
            if(!data.button_url) delete data.button_url;

            const res = await fetch('/api/bot/broadcast', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            
            const json = await res.json();
            if(json.success) {
                status.textContent = 'Muvaffaqiyatli yuborildi!';
                status.className = 'mt-2 text-center text-success small';
                e.target.reset();
                loadHistory();
            } else {
                throw new Error(json.error || 'Server xatosi');
            }
        } catch(err) {
            status.textContent = 'Xatolik: ' + err.message;
            status.className = 'mt-2 text-center text-danger small';
        } finally {
            btn.disabled = false;
        }
    });
});

async function loadSubscribers() {
    try {
        const res = await fetch('/api/bot/subscribers');
        const data = await res.json();
        if(data.success) {
            document.getElementById('subCount').textContent = data.subscribers.length;
        }
    } catch(e) { console.error(e); }
}

async function loadHistory() {
    try {
        const res = await fetch('/api/super-admin/bot/history?limit=10');
        const data = await res.json();
        const tbody = document.getElementById('historyBody');
        tbody.innerHTML = '';
        
        if(data.success && data.history) {
            data.history.forEach(item => {
                const badge = item.status === 'completed' ? 'bg-success' : 
                              item.status === 'failed' ? 'bg-danger' : 'bg-warning text-dark';
                              
                const row = `
                    <tr>
                        <td>#${item.id}</td>
                        <td><span class="badge bg-light text-dark border">${item.type}</span></td>
                        <td><span class="badge ${badge}">${item.status}</span></td>
                        <td class="small text-muted">${new Date(item.created_at).toLocaleString()}</td>
                    </tr>
                `;
                tbody.insertAdjacentHTML('beforeend', row);
                
                if (item === data.history[0]) {
                     document.getElementById('lastMsgTime').textContent = new Date(item.created_at).toLocaleTimeString();
                }
            });
        }
    } catch(e) { console.error(e); }
}
</script>
{% endblock %}
