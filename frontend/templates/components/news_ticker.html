<!-- E-commerce style News Ticker (safety shoes/shop style) -->
<div class="news-ticker-container py-4">


  <div class="news-ticker-swiper swiper" id="news-ticker-swiper">
    <!-- Navigation buttons -->
    <div class="news-ticker-nav prev" onclick="window._newsTickerSwiper?.slidePrev()">
      <i class="bi bi-chevron-left"></i>
    </div>
    <div class="news-ticker-nav next" onclick="window._newsTickerSwiper?.slideNext()">
      <i class="bi bi-chevron-right"></i>
    </div>
    
    <div class="swiper-wrapper" id="news-ticker-content">
      <!-- Slides injected by JS: each slide will contain only the image. Title shown on hover. -->
      <div class="swiper-slide news-item loading">
        <div class="news-image-wrapper" style="width:120px; height:120px; border-radius:8px; overflow:hidden; background:#f3f4f6"></div>
      </div>
    </div>
  </div>

  <style>
/* Enhanced News Ticker Styles */
.news-ticker-container {
  background: linear-gradient(135deg, rgba(255, 215, 0, 0.05), rgba(255, 215, 0, 0.02));
  border-bottom: 1px solid rgba(255, 215, 0, 0.1);
  position: relative;
  overflow: hidden;
}

.news-ticker-container::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent-primary, #FFD700), transparent);
  animation: tickerShine 3s ease-in-out infinite;
}

@keyframes tickerShine {
  0% { left: -100%; }
  50% { left: 100%; }
  100% { left: 100%; }
}

.news-ticker-swiper {
  padding: 16px 0;
  position: relative;
}

/* Center the swiper container */
.news-ticker-swiper .swiper-wrapper {
  justify-content: center;
  align-items: center;
}

.news-item {
  width: 320px !important;
  height: 220px !important;
  border-radius: 16px !important;
  overflow: hidden;
  position: relative;
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
  cursor: pointer;
  margin: 0 auto;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

.news-item:hover {
  transform: translateY(-10px) scale(1.02);
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
  border-color: var(--accent-primary, #FFD700);
}

.news-image-wrapper {
  width: 100%;
  height: 100%;
  position: relative;
  overflow: hidden;
}

.news-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.6s ease;
  filter: brightness(0.85);
}

.news-item:hover img {
  transform: scale(1.1);
  filter: brightness(1);
}

.news-title-overlay {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.6) 50%, transparent 100%);
  color: #fff;
  padding: 30px 20px 15px;
  font-size: 1.1rem;
  font-weight: 600;
  opacity: 1; /* Always visible but slightly faded normally? No, let's keep it visible on hover but with better transition */
  transform: translateY(0);
  transition: all 0.4s ease;
  line-height: 1.3;
  text-shadow: 0 2px 4px rgba(0,0,0,0.5);
}

.news-item:hover .news-title-overlay {
  padding-bottom: 25px;
  color: var(--accent-primary, #FFD700);
}

.news-slide-link {
  display: block;
  width: 100%;
  height: 100%;
  text-decoration: none;
}

/* Loading state */
.news-item.loading {
  background: linear-gradient(90deg, rgba(255, 255, 255, 0.05) 25%, rgba(255, 255, 255, 0.1) 50%, rgba(255, 255, 255, 0.05) 75%);
  background-size: 200% 100%;
  animation: loadingShimmer 1.5s ease-in-out infinite;
}

@keyframes loadingShimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

.news-text-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  padding: 24px;
  text-align: center;
  color: #fff;
  background: rgba(0,0,0,0.4);
}

/* Navigation buttons for better slider control */
.news-ticker-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 36px;
  height: 36px;
  background: rgba(255, 215, 0, 0.85);
  backdrop-filter: blur(4px);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 10;
  transition: all 0.3s ease;
  color: #000;
  font-size: 14px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

.news-ticker-nav:hover {
  background: var(--accent-primary, #FFD700);
  transform: translateY(-50%) scale(1.1);
}

.news-ticker-nav.prev {
  left: 10px;
}

.news-ticker-nav.next {
  right: 10px;
}
  </style>

{# News ticker script is included globally in base.html; avoid duplicate includes here #}

  </div>
