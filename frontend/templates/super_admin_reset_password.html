{% extends "super_admin_base.html" %} {% block title %}Yangi parol{% endblock %} {% block
content %}
<div class="center-card">
  <h2>Yangi parol o'rnating</h2>
  <form method="post" action="{{ url_for('super_admin_reset_password') }}">
    <div class="form-group">
      <label>Yangi parol</label>
      <input type="password" name="password" required minlength="6" />
    </div>
    <div class="form-group">
      <label>Yangi parol (tasdiqlash)</label>
      <input type="password" name="password_confirm" required minlength="6" />
    </div>
    <button class="btn btn-primary" type="submit">Parolni o'zgartirish</button>
  </form>
</div>
<style>
  .center-card {
    max-width: 480px;
    margin: 40px auto;
    padding: 24px;
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
  }
  .form-group {
    margin-bottom: 14px;
  }
</style>
{% endblock %}
