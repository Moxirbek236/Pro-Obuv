<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Staff Panel{% endblock %} | Safety.uz</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Universal Staff CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/staff-universal.css') }}">
    
    {% block head %}{% endblock %}
</head>
<body>
    <!-- Mobile Menu Toggle -->
    <button class="mobile-menu-toggle" onclick="toggleSidebar()">
        <i class="bi bi-list"></i>
    </button>

    <div class="staff-dashboard-layout">
        <!-- Staff Sidebar -->
        <div class="staff-sidebar" id="staffSidebar">
            <div class="p-3">
                <h5 class="text-center mb-4">
                    <i class="bi bi-shield-check text-primary"></i>
                    <span class="ms-2">Staff Panel</span>
                </h5>
            </div>
            
            {% block sidebar_menu %}
            <!-- Sidebar content will be injected from child templates -->
            {% endblock %}
        </div>
        
        <!-- Main Content -->
        <div class="staff-main-content">
            {% block staff_content %}
            <!-- Main content will be injected from child templates -->
            {% endblock %}
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <script>
    function toggleSidebar() {
        const sidebar = document.getElementById('staffSidebar');
        sidebar.classList.toggle('active');
    }

    // Close sidebar when clicking outside on mobile
    document.addEventListener('click', function(event) {
        const sidebar = document.getElementById('staffSidebar');
        const toggle = document.querySelector('.mobile-menu-toggle');
        
        if (window.innerWidth <= 768 && 
            !sidebar.contains(event.target) && 
            !toggle.contains(event.target)) {
            sidebar.classList.remove('active');
        }
    });
    </script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
