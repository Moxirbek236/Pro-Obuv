name: Regenerate sitemap

on:
  schedule:
    - cron: "0 2 * * *" # daily at 02:00 UTC
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run sitemap generator
        run: |
          python tools/generate_sitemap.py https://safety.uz,https://www.safety.uz

      - name: Commit sitemap and robots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml || true
          git add robots.txt || true
          git commit -m "chore: regenerate sitemap & robots.txt" || echo "no changes to commit"
          git push || echo "push failed"
